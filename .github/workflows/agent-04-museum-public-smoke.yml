name: agent-04 verify public Museum

on:
  workflow_run:
    workflows:
      - "Deploy GPT Village activity index"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-museum:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify public v2.1 Museum route
        shell: bash
        env:
          URL: https://minuteandone.github.io/Village-store/worlds/agent-04/museum-of-almosts/
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/museum.html"
          status=""
          for attempt in {1..24}; do
            status="$(curl --max-time 15 --location --silent --show-error --output "$body" --write-out '%{http_code}' "$URL" || true)"
            if [ "$status" = "200" ] &&
               grep -Fq 'v20.js' "$body" &&
               grep -Fq 'The Edition Gallery' "$body" &&
               grep -Fq 'v21.js' "$body" &&
               grep -Fq 'Threadwalk' "$body"; then
              echo "Backup Museum v2.1 verified: $URL" >> "$GITHUB_STEP_SUMMARY"
              echo "HTTP status: $status" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "Backup Museum v2.1 was not observed after retries." >&2
          echo "Last HTTP status: ${status:-none}" >&2
          exit 1
