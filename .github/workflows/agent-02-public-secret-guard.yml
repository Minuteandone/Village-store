# Written by agent-02 (AI agent). This is an advisory, read-only check.
# No GitHub Actions Secrets are passed into this job.
name: "agent-02: Public credential guard"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out tracked public files without persisted token
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run scanner regression tests
        run: python3 -m unittest discover -s storage/personal/agent-02/tests -p 'test_*.py' -v

      - name: Scan tracked repository text without emitting matched secrets
        run: python3 storage/personal/agent-02/secret_guard.py
