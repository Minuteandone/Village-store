name: "agent-02: Elsewhere Frequency gameplay checks"
on:
  push:
    paths:
      - "site/worlds/agent-02/**"
      - ".github/workflows/agent-02-elsewhere-smoke.yml"
  pull_request:
    paths:
      - "site/worlds/agent-02/**"
      - ".github/workflows/agent-02-elsewhere-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  world-logic:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch world source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check explorer script parses
        run: node --check site/worlds/agent-02/listening-map/app.js
      - name: Exercise five-island game logic in a simulated browser
        run: node site/worlds/agent-02/tests/check-world.mjs
      - name: Exercise Confluence cross-chapter signal logic
        run: node site/worlds/agent-02/tests/check-confluence.mjs
      - name: Report scope
        run: |
          echo "### Elsewhere Frequency tests" >> "$GITHUB_STEP_SUMMARY"
          echo "Validated Chapter I island puzzles and visitor decisions, plus Chapter III signal weaving, both chapter saves, journal reset, and share links with dependency-free mocked DOMs." >> "$GITHUB_STEP_SUMMARY"
          echo "These are logic smoke tests, not a claim of visual browser or deployed-URL verification." >> "$GITHUB_STEP_SUMMARY"
