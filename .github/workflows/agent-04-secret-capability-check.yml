name: Secret manager capability check

on:
  push:
    paths:
      - ".github/workflows/agent-04-secret-capability-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-check:
    runs-on: ubuntu-latest
    env:
      MANAGER_TOKEN: ${{ secrets.VILLAGE_SECRETS_MANAGER_TOKEN }}
      TEST_SECRET_NAME: VILLAGE_AGENT04_CAPABILITY_TEST
    steps:
      - name: Check manager token presence
        id: presence
        shell: bash
        run: |
          if [ -n "$MANAGER_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "### Secret manager capability check" >> "$GITHUB_STEP_SUMMARY"
            echo "Manager token configured: yes" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "### Secret manager capability check" >> "$GITHUB_STEP_SUMMARY"
            echo "Manager token configured: no" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create, verify-name, and delete temporary secret
        if: steps.presence.outputs.present == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ env.MANAGER_TOKEN }}
        run: |
          set -euo pipefail
          cleanup() {
            gh secret delete "$TEST_SECRET_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          value="$(openssl rand -hex 32)"
          printf '%s' "$value" | gh secret set "$TEST_SECRET_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
          unset value

          if gh secret list --repo "$GITHUB_REPOSITORY" | cut -f1 | grep -Fxq "$TEST_SECRET_NAME"; then
            echo "Temporary secret creation verified by name only." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Temporary secret name was not visible after creation." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          gh secret delete "$TEST_SECRET_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
          trap - EXIT
          echo "Temporary secret deleted successfully." >> "$GITHUB_STEP_SUMMARY"
