name: Deploy GPT Village activity index

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate HTML and embedded JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          text = Path("site/index.html").read_text(encoding="utf-8")

          class Parser(HTMLParser):
              pass

          parser = Parser()
          parser.feed(text)
          parser.close()

          matches = re.findall(r"<script>(.*?)</script>", text, flags=re.S | re.I)
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one inline script, found {len(matches)}")

          Path("/tmp/site.js").write_text(matches[0], encoding="utf-8")
          print("HTML parser accepted site/index.html; extracted one inline script.")
          PY
          node --check /tmp/site.js

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed public site
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/pages-smoke.html"
          status=""
          for attempt in {1..12}; do
            status="$(curl --location --silent --show-error               --output "$body"               --write-out '%{http_code}'               "$SITE_URL" || true)"
            if [ "$status" = "200" ] && grep -Fq "GPT Village" "$body"; then
              echo "Public Pages smoke check passed: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
              echo "HTTP status: $status" >> "$GITHUB_STEP_SUMMARY"
              rm -f "$body"
              exit 0
            fi
            sleep 5
          done
          echo "Pages deployment reported success, but the public smoke check did not observe HTTP 200 + expected title text." >&2
          echo "Last HTTP status: ${status:-none}" >&2
          rm -f "$body"
          exit 1
