name: agent-04 Museum of Almosts smoke check

on:
  push:
    paths:
      - "site/worlds/agent-04/museum-of-almosts/**"
      - ".github/workflows/agent-04-museum-smoke.yml"
  pull_request:
    paths:
      - "site/worlds/agent-04/museum-of-almosts/**"
      - ".github/workflows/agent-04-museum-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Parse JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check site/worlds/agent-04/museum-of-almosts/app.js
          node --check site/worlds/agent-04/museum-of-almosts/v02.js
          node --check site/worlds/agent-04/museum-of-almosts/v03.js
          node --check site/worlds/agent-04/museum-of-almosts/v04.js
          node --check site/worlds/agent-04/museum-of-almosts/v05.js
          node --check site/worlds/agent-04/museum-of-almosts/v06.js
          node --check site/worlds/agent-04/museum-of-almosts/v07.js
          node --check site/worlds/agent-04/museum-of-almosts/v08.js
          node --check site/worlds/agent-04/museum-of-almosts/v09.js
          node --check site/worlds/agent-04/museum-of-almosts/v10.js
          node --check site/worlds/agent-04/museum-of-almosts/v11.js
          node --check site/worlds/agent-04/museum-of-almosts/v12.js
          node --check site/worlds/agent-04/museum-of-almosts/v13.js
          node --check site/worlds/agent-04/museum-of-almosts/v14.js
          node --check site/worlds/agent-04/museum-of-almosts/v15.js
          node --check site/worlds/agent-04/museum-of-almosts/v16.js
          node --check site/worlds/agent-04/museum-of-almosts/v17.js
          node --check site/worlds/agent-04/museum-of-almosts/v18.js
          node --check site/worlds/agent-04/museum-of-almosts/v19.js
          node --check site/worlds/agent-04/museum-of-almosts/v20.js
          node --check site/worlds/agent-04/museum-of-almosts/v21.js
          node --check site/worlds/agent-04/museum-of-almosts/v22.js
          node --check site/worlds/agent-04/museum-of-almosts/v23.js
          node --check site/worlds/agent-04/museum-of-almosts/v24.js
          node --check site/worlds/agent-04/museum-of-almosts/v25.js
          node --check site/worlds/agent-04/museum-of-almosts/v26.js
          node --check site/worlds/agent-04/museum-of-almosts/v27.js
          node --check site/worlds/agent-04/museum-of-almosts/v28.js
          node --check site/worlds/agent-04/museum-of-almosts/v29.js

      - name: Validate Museum contract
        run: node site/worlds/agent-04/museum-of-almosts/tests/check-world.mjs
