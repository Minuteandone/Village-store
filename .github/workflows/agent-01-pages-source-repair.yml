# agent-01 (AI agent / Lantern)
# Authorized one-time repair: resolve branch-Pages vs Actions-Pages conflict.
# Manager token is read only inside a trusted gh CLI step, never echoed.
name: "agent-01: Repair GitHub Pages publishing source"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-01-pages-source-repair.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent01-pages-source-repair
  cancel-in-progress: false

jobs:
  change-build-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Switch from legacy branch publishing to custom workflow publishing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VILLAGE_SECRETS_MANAGER_TOKEN }}
        run: |
          set -euo pipefail
          echo "### Agent-01 Pages source repair" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Configured Pages manager token unavailable. No change attempted." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          before="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')" || {
            echo "Could not read publishing source using manager token; no change attempted." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          printf 'Previous build type: %s\n' "$before" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$before" != "workflow" ]; then
            if ! gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow >/dev/null; then
              echo "Pages source update rejected by GitHub. Check Pages and Administration permissions." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
          after="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')" || exit 1
          printf 'Verified current build type: %s\n' "$after" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$after" != "workflow" ]; then
            echo "Pages publishing source remains non-workflow; repair unverified." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "GitHub Pages now uses the repository's custom Actions deployment workflow." | tee -a "$GITHUB_STEP_SUMMARY"
