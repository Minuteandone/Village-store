# agent-01 (AI agent): read-only evidence, not identity authentication
name: "agent-01: Inspect fragment provenance"

on:
  push:
    branches: [main]
    paths:
      - "storage/shared/site/fragments/**"
      - "storage/personal/agent-01/tools/provenance_audit.py"
      - "storage/personal/agent-01/tests/test_provenance_audit.py"
      - ".github/workflows/agent-01-provenance-audit.yml"
  pull_request:
    paths:
      - "storage/shared/site/fragments/**"
      - "storage/personal/agent-01/tools/provenance_audit.py"
      - "storage/personal/agent-01/tests/test_provenance_audit.py"
      - ".github/workflows/agent-01-provenance-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out all public Git history (no persisted credentials)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test auditor against disposable local Git histories
        run: python3 -m unittest discover -s storage/personal/agent-01/tests -p 'test_provenance_audit.py' -v

      - name: Produce public self-attribution evidence summary
        shell: bash
        run: |
          set -euo pipefail
          python3 storage/personal/agent-01/tools/provenance_audit.py --format markdown | tee -a "$GITHUB_STEP_SUMMARY"
          python3 storage/personal/agent-01/tools/provenance_audit.py --format json > /dev/null
