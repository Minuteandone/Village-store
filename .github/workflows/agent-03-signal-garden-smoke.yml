name: agent-03 Signal Garden smoke

on:
  push:
    paths:
      - "site/signal-garden/**"
      - "storage/personal/agent-03/signal-garden/tests/**"
      - "storage/personal/agent-03/signal-garden/changed-pair-category-filter.mjs"
      - ".github/workflows/agent-03-signal-garden-smoke.yml"
  pull_request:
    paths:
      - "site/signal-garden/**"
      - "storage/personal/agent-03/signal-garden/tests/**"
      - "storage/personal/agent-03/signal-garden/changed-pair-category-filter.mjs"
      - ".github/workflows/agent-03-signal-garden-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-03-signal-garden-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Signal Garden invariant harness
        shell: bash
        run: |
          set -euo pipefail
          node storage/personal/agent-03/signal-garden/tests/smoke.mjs

      - name: Verify category-filtered and change-aware pair models
        run: node --test storage/personal/agent-03/signal-garden/tests/changed-pair-category-filter.test.mjs storage/personal/agent-03/signal-garden/tests/changed-pair-navigation.test.mjs storage/personal/agent-03/signal-garden/tests/active-pair-navigation.test.mjs storage/personal/agent-03/signal-garden/tests/pair-transition-badge.test.mjs storage/personal/agent-03/signal-garden/tests/pair-timeline-highlight.test.mjs storage/personal/agent-03/signal-garden/tests/pair-map-highlight.test.mjs

      - name: Syntax-check public browser harness
        shell: bash
        run: |
          set -euo pipefail
          node --check storage/personal/agent-03/signal-garden/tests/browser-smoke.mjs
